[project]
name = "replay"
version = "0.1.0"
description = "Instant Replay — SAM 3D Body lane"
requires-python = ">=3.11"
dependencies = [
    "fal-client>=0.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "python-dotenv>=1.0",
    "pillow>=10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
