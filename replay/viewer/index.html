<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instant Replay</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e121a; }
    #replay { height: 100vh; }
  </style>
  <!-- TODO before the demo: vendor three into viewer/vendor/ (hotspot network) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="replay"></div>
  <script type="module">
    import { mountReplay } from './replay.js';
    // ?src=<folder>/  — a run folder (summary.json + .ply) or a service bundle (meta.json + .bin)
    const src = new URLSearchParams(location.search).get('src') || '/data/fal_out/synthetic/';
    const view = new URLSearchParams(location.search).get('view');
    mountReplay(document.getElementById('replay'), src, {
      onSeek: t => console.log('[replay] seek', t),
    }).then(r => { window.replay = r; if (view) r.setView(view); });
  </script>
</body>
</html>
